 role="img" aria-labelledby="title-fisicatransformacoesge desc-fisicatransformacoesge">
<title id="title-fisicatransformacoesge">Transformações geométricas</title>
<desc id="desc-fisicatransformacoesge">Ilustração didática vetorial premium sobre Transformações geométricas, da disciplina Física.</desc>

    <defs>
